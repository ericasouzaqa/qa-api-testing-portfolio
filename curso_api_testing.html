<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do Zero à Automação de API — Postman + Cypress</title>
    <style>
      :root {
        --bg: #14181c;
        --surface: #1c2228;
        --surface-raised: #232a31;
        --line: #333b43;
        --text: #e8e6df;
        --text-dim: #9aa3ab;
        --amber: #d4a537;
        --amber-dim: #3a331e;
        --teal: #4a7a6f;
        --teal-dim: #1e2c29;
        --brick: #b65c4a;
        --brick-dim: #31201c;
        --violet: #7c6fa8;
        --violet-dim: #241f35;
        --blue: #3a6fa8;
        --blue-dim: #1a2535;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        height: 100%;
      }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      .shell {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .app {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 0;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        flex: 1;
      }
      body.standalone {
        background: radial-gradient(circle at 15% 10%, #1c232b, var(--bg) 55%);
        min-height: 100vh;
      }
      body.standalone .shell {
        min-height: 100vh;
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 20px;
      }
      body.standalone .app {
        min-height: calc(100vh - 56px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      @media (max-width: 820px) {
        body.standalone .shell {
          padding: 0;
        }
        body.standalone .app {
          min-height: 100vh;
          border-radius: 0;
          border: none;
        }
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          max-height: 300px;
          border-right: none !important;
          border-bottom: 1px solid var(--line);
        }
      }
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 16px 14px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 2;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        flex: none;
      }
      .brand .gear {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 15px;
        padding: 2px;
        line-height: 1;
      }
      .brand .gear:hover {
        color: var(--text);
      }
      .overall-progress {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .overall-progress .lbl {
        font-size: 11px;
        color: var(--text-dim);
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .bar {
        height: 5px;
        border-radius: 4px;
        background: var(--surface-raised);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--amber);
        transition: width 0.3s ease;
      }
      .btn-continue {
        width: 100%;
        margin-top: 9px;
      }
      .module {
        border-bottom: 1px solid var(--line);
      }
      .module-head {
        padding: 11px 14px;
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        user-select: none;
      }
      .module-head:hover {
        background: var(--surface-raised);
      }
      .module-head b {
        font-size: 12px;
        font-weight: 600;
        flex: 1;
        line-height: 1.35;
      }
      .module-head .cnt {
        font-size: 10px;
        color: var(--text-dim);
        font-family: 'IBM Plex Mono', monospace;
        white-space: nowrap;
      }
      .module-head .chev {
        color: var(--text-dim);
        font-size: 9px;
        transition: transform 0.15s;
        flex: none;
      }
      .module.open .chev {
        transform: rotate(90deg);
      }
      .mod-bar {
        height: 2px;
        background: var(--surface-raised);
        margin: 0 14px 6px;
        border-radius: 2px;
        overflow: hidden;
      }
      .mod-bar-fill {
        height: 100%;
        background: var(--teal);
      }
      .lesson-list {
        display: none;
        padding-bottom: 6px;
      }
      .module.open .lesson-list {
        display: block;
      }
      .lesson-item {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 14px 6px 24px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-dim);
      }
      .lesson-item:hover {
        background: var(--surface-raised);
        color: var(--text);
      }
      .lesson-item.active {
        background: var(--amber-dim);
        color: var(--amber);
      }
      .lesson-item.new-topic .ltitle::before {
        content: '🆕 ';
        font-size: 10px;
      }
      .lesson-item .chk {
        width: 13px;
        height: 13px;
        border-radius: 3px;
        border: 1.5px solid var(--text-dim);
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
      }
      .lesson-item.done .chk {
        background: var(--teal);
        border-color: var(--teal);
        color: #0d1512;
      }
      .lesson-item .ltitle {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .main {
        padding: 26px 32px;
        overflow-y: auto;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        margin: 0 0 4px;
        font-weight: 700;
      }
      h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        margin: 20px 0 10px;
        font-weight: 600;
      }
      .subtitle {
        color: var(--text-dim);
        font-size: 13px;
        margin-bottom: 18px;
      }
      .lesson-header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .badge {
        font-size: 11px;
        color: var(--text-dim);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 3px 10px;
      }
      .badge.new {
        border-color: var(--violet);
        color: var(--violet);
      }
      button {
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 600;
        font-size: 13px;
        padding: 9px 16px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface-raised);
        color: var(--text);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      button:hover {
        border-color: var(--text-dim);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--amber);
        border-color: var(--amber);
        color: #1a1608;
      }
      button.primary:hover {
        background: #e0b247;
      }
      button.ghost {
        background: transparent;
      }
      button.small {
        padding: 5px 11px;
        font-size: 12px;
      }
      button.teal {
        background: var(--teal);
        border-color: var(--teal);
        color: #0d1512;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        align-items: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 13px;
      }
      .card h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        margin: 0 0 9px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .card p {
        margin: 0;
        font-size: 13.5px;
      }
      .card ul,
      .card ol {
        margin: 0;
        padding-left: 17px;
      }
      .card li {
        margin-bottom: 5px;
        font-size: 13.5px;
      }
      .code-wrap {
        background: #10151a;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 8px;
        overflow: hidden;
      }
      .code-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 12px;
        border-bottom: 1px solid var(--line);
      }
      .code-label {
        font-size: 10.5px;
        color: var(--text-dim);
        font-family: 'IBM Plex Sans', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .code-body {
        padding: 13px 14px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-x: auto;
        color: var(--text);
      }
      .callout {
        border-radius: 8px;
        padding: 13px 15px;
        margin-bottom: 13px;
        font-size: 13px;
      }
      .callout h4 {
        margin: 0 0 7px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-family: 'Space Grotesk', sans-serif;
      }
      .callout p {
        margin: 0;
      }
      .callout.desafio {
        background: var(--violet-dim);
        border: 1px solid var(--violet);
      }
      .callout.desafio h4 {
        color: var(--violet);
      }
      .callout.teste {
        background: var(--teal-dim);
        border: 1px solid var(--teal);
      }
      .callout.teste h4 {
        color: var(--teal);
      }
      .checklist-item {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        cursor: pointer;
      }
      .checklist-item:last-child {
        border-bottom: none;
      }
      .checklist-item .box {
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--text-dim);
        border-radius: 3px;
        flex: none;
        margin-top: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
      }
      .checklist-item.checked .box {
        background: var(--teal);
        border-color: var(--teal);
        color: #0d1512;
      }
      .checklist-item.checked .txt {
        color: var(--text-dim);
        text-decoration: line-through;
      }
      .nivel-row {
        display: flex;
        gap: 5px;
        margin-top: 7px;
        flex-wrap: wrap;
      }
      .nivel-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        background: var(--surface-raised);
        cursor: pointer;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nivel-dot.sel {
        border-color: var(--amber);
        box-shadow: 0 0 0 2px var(--amber-dim);
      }
      .nivel-lbl {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 5px;
      }
      .intro-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }
      .intro-card h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13.5px;
        margin: 0 0 7px;
      }
      .intro-card p {
        margin: 0 0 7px;
        font-size: 13px;
        color: var(--text-dim);
      }
      .api-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 4px 11px;
        font-size: 11.5px;
        font-family: 'IBM Plex Mono', monospace;
        margin: 2px 5px 2px 0;
      }
      .tag {
        display: inline-block;
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 10px;
        font-weight: 600;
        margin-left: 6px;
        vertical-align: middle;
      }
      .tag.novo {
        background: var(--violet-dim);
        color: var(--violet);
        border: 1px solid var(--violet);
      }
      .loading {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-dim);
        font-size: 13px;
        padding: 14px 0;
      }
      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid var(--line);
        border-top-color: var(--amber);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error-box {
        background: var(--brick-dim);
        border: 1px solid var(--brick);
        color: var(--text);
        border-radius: 8px;
        padding: 13px 15px;
        font-size: 13px;
        margin-bottom: 13px;
      }
      .footer-note {
        text-align: center;
        font-size: 11px;
        color: var(--text-dim);
        padding: 12px 6px 4px;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }
      .modal-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px;
        max-width: 480px;
        width: 100%;
      }
      .modal-card h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        margin: 0 0 6px;
      }
      .modal-card input[type='password'] {
        width: 100%;
        background: #10151a;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        padding: 10px 12px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12.5px;
        margin: 10px 0;
      }
      .modal-note {
        font-size: 11.5px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="app">
        <div class="sidebar">
          <div class="brand">
            <span class="dot"></span>Zero → Automação de API
          </div>
          <div class="overall-progress">
            <div class="lbl">
              <span>Progresso</span><span id="overall-label">0/0</span>
            </div>
            <div class="bar">
              <div class="bar-fill" id="overall-bar" style="width: 0%"></div>
            </div>
            <button class="small primary btn-continue" id="btn-continuar">
              Continuar de onde parei →
            </button>
          </div>
          <div id="modules-list"></div>
        </div>
        <div class="main">
          <div id="content-area"></div>
        </div>
      </div>
      <div class="footer-note">
        Progresso salvo neste navegador · Versão 1.1.0
      </div>
    </div>

    <script>
      const CURRICULO = [
        {
          id: 'm1',
          titulo: 'Fundamentos de API e HTTP',
          licoes: [
            {
              id: 'm1-l1',
              titulo: 'O que é uma API — cliente e servidor',

            },
            {
              id: 'm1-l2',
              titulo: 'Request e Response',
              desc: 'O ciclo de pedir e receber dados: o que compõe uma requisição e uma resposta.',

            {
              id: 'm1-l3',
              titulo: 'HTTP e HTTPS',
              desc: 'O protocolo por trás de toda comunicação web, e por que o "S" importa.',
            },
            {
              id: 'm1-l4',
              titulo: 'URL, endpoint, path e query parameters',
              desc: 'Como decompor um endereço de API e entender cada parte dele — URL base, path, query string, fragmento.',
            },
            {
              id: 'm1-l5',

            },
            {
              id: 'm1-l6',
              titulo: 'Status codes — 2xx, 4xx, 5xx',

            {
              id: 'm1-l7',
              titulo: 'Headers e Body',
              desc: 'Metadados da requisição vs. o conteúdo em si — Content-Type, Authorization, Accept.',
            },
            {
              id: 'm1-l8',
              titulo: 'Autenticação e Autorização',
              desc: 'A diferença entre "quem você é" e "o que você pode fazer" — Basic Auth, Bearer Token, API Key.',
            },
            {
              id: 'm1-l9',
              titulo: 'JSON, REST e CRUD',
              desc: 'O formato de dados padrão, o estilo de arquitetura, e as quatro operações básicas.',
            },
          ],
        },
        {
          id: 'm2',
          titulo: 'Pensando como QA de API',
          licoes: [
            {
              id: 'm2-l1',
              titulo: 'Cenários positivos (happy path)',
              desc: 'O caminho esperado: o que validar quando tudo dá certo.',
            },
            {
              id: 'm2-l2',
              titulo: 'Cenários negativos (negative path)',
              desc: 'O que testar quando algo dá errado de propósito: dados inválidos, ausentes, malformados.',
            },
            {
              id: 'm2-l3',
              titulo: 'Contratos de API e validação de resposta',
              desc: 'O que é um contrato de API e como validar que a resposta cumpre o que promete.',
            },
            {
              id: 'm2-l4',
              titulo: 'Matriz de cenários de teste',
              desc: 'Construindo a tabela: Cenário → Entrada → Resultado esperado → Validações.',
            },
            {
              id: 'm2-l5',
              titulo: 'Dados de teste',
              desc: 'Como pensar os dados que você usa para testar: variedade, limites, formatos, dados mockados.',
            },
          ],
        },
        {
          id: 'm25',
          titulo: 'Lendo e interpretando documentação de API',
          novo: true,
          licoes: [
            {
              id: 'm25-l1',
              titulo: 'O que é documentação de API e por que ela existe',
              desc: 'Por que toda API precisa de documentação, o que você encontra nela e como não se perder na primeira vez que abrir.',
              novo: true,
            },
            {
              id: 'm25-l2',
              titulo: 'Anatomia de um endpoint documentado',
              desc: 'Decompondo cada parte de um endpoint documentado: método, URL base, path, parâmetros, headers obrigatórios, body esperado, resposta de sucesso e de erro.',
              novo: true,
            },
            {
              id: 'm25-l3',
              titulo: 'O que é Swagger — lendo e navegando',
              desc: 'O que é Swagger/OpenAPI, como navegar na interface, onde ficam os endpoints, o que cada campo significa e como testar direto no Swagger UI.',
              novo: true,
            },
            {
              id: 'm25-l4',
              titulo: 'O que é um DTO (Data Transfer Object)',
              desc: 'O que é DTO, por que ele existe, como lê-lo na documentação, como o DTO define o que você envia e o que você recebe, e como usar isso para montar seus testes.',
              novo: true,
            },
            {
              id: 'm25-l5',
              titulo: 'O que é um contrato de API — na prática',

            },
            {
              id: 'm25-l6',

            },
            {
              id: 'm25-l7',
              titulo: 'Lendo a documentação da Restful-Booker — guiado',

            },
            {
              id: 'm25-l8',
              titulo: 'De documentação para caso de teste — passo a passo',

            },
            {
              id: 'm25-l9',
              titulo:

              desc: 'Como ler um script de teste pronto e saber exatamente o que você precisa substituir, onde buscar esse valor, e o que acontece se você não substituir.',
              novo: true,
            },
            {
              id: 'm25-l10',
              titulo:
                'Montando seu primeiro script completo a partir da documentação',
              desc: 'Exercício prático: pegar a documentação de um endpoint da Restful-Booker, entender o DTO, identificar o contrato, e montar do zero um script de teste no Postman.',
              novo: true,
            },
          ],
        },
        {
          id: 'm3',
          titulo: 'Postman — do zero à suíte profissional',
          licoes: [
            {
              id: 'm3-l1',
              titulo: 'Instalação e interface',
              desc: 'Workspace, request, onde fica cada coisa no Postman.',
            },
            {
              id: 'm3-l2',
              titulo: 'Primeira request — GET na Restful-Booker',
              desc: 'Sua primeira chamada de API real, passo a passo.',
            },
            {
              id: 'm3-l3',
              titulo: 'Params, Headers e Body na prática',
              desc: 'Montando uma requisição completa dentro do Postman.',
            },
            {
              id: 'm3-l4',
              titulo: 'Collections — organização profissional',
              desc: 'O que são, por que existem, como estruturar uma suíte.',
            },
            {
              id: 'm3-l5',
              titulo: 'Variáveis e Environments',
              desc: 'Por que {{baseUrl}} é melhor que repetir a URL em cada request.',
            },
            {
              id: 'm3-l6',
              titulo: 'Scripts de teste e assertions — pm.test()',
              desc: 'Escrevendo testes dentro do Postman com JavaScript.',
            },
            {
              id: 'm3-l7',
              titulo: 'Dados mockados no Postman — Mock Server',
              desc: 'Como criar um Mock Server no Postman, quando usar, e como testar contra dados simulados antes da API existir de verdade.',
              novo: true,
            },
            {
              id: 'm3-l8',
              titulo: 'Fluxo POST → capturar ID → GET → validar',
              desc: 'Encadeando requisições e reaproveitando dados entre elas.',
            },
            {
              id: 'm3-l9',
              titulo: 'Autenticação na prática — POST /auth na Restful-Booker',
              desc: 'Gerando e usando um token de autenticação.',
            },
            {
              id: 'm3-l10',
              titulo: 'Collection Runner',
              desc: 'Executando uma suíte inteira de uma vez.',
            },
            {
              id: 'm3-l11',
              titulo: 'Organizando como projeto profissional',
              desc: 'Transformando uma Collection de exercícios em estrutura de empresa.',
            },
          ],
        },
        {
          id: 'm4',
          titulo: 'Cypress — do zero ao primeiro teste de API',
          licoes: [
            {
              id: 'm4-l1',
              titulo: 'Por que Cypress (Postman vs. Cypress)',
              desc: 'Quando cada ferramenta faz mais sentido, e por que aprender as duas.',
            },
            {
              id: 'm4-l2',
              titulo: 'Instalação — Node.js, npm e Cypress',
              desc: 'Preparando o ambiente antes do primeiro teste.',
            },
            {
              id: 'm4-l3',
              titulo: 'Estrutura do projeto e configuração',
              desc: 'Como um projeto Cypress é organizado por padrão.',
            },
            {
              id: 'm4-l4',
              titulo: 'Primeiro teste — describe, it, cy.request()',
              desc: 'Escrevendo e rodando seu primeiro teste de API em código.',
            },
            {
              id: 'm4-l5',
              titulo: 'Assertions com expect() e then()',
              desc: 'Validando respostas de forma programática.',
            },
            {
              id: 'm4-l6',
              titulo: 'GET → validar status e body',
              desc: 'Seu primeiro teste completo de leitura de dados.',
            },
            {
              id: 'm4-l7',
              titulo: 'POST → validar criação e capturar dados',
              desc: 'Criando um recurso e usando o retorno nos passos seguintes.',
            },
            {
              id: 'm4-l8',
              titulo: 'Fluxo POST → GET → UPDATE → GET',
              desc: 'Ciclo completo de atualização encadeado.',
            },
            {
              id: 'm4-l9',
              titulo: 'Fluxo POST → GET → DELETE → validar remoção',
              desc: 'Ciclo completo de exclusão encadeado.',
            },
          ],
        },
        {
          id: 'm5',
          titulo: 'Arquitetura profissional e boas práticas',
          licoes: [
            {
              id: 'm5-l1',
              titulo: 'Organização de arquivos e fixtures',
              desc: 'Separando dados de teste do código de teste.',
            },
            {
              id: 'm5-l2',
              titulo: 'Comandos reutilizáveis (custom commands)',
              desc: 'Evitando repetição — criando seus próprios comandos Cypress.',
            },
            {
              id: 'm5-l3',
              titulo: 'Variáveis de ambiente e dados de teste',
              desc: 'Configurações que mudam entre ambientes, sem tocar no código.',
            },
            {
              id: 'm5-l4',
              titulo: 'Independência entre testes e manutenção',
              desc: 'Por que um teste não deve depender do resultado de outro.',
            },
          ],
        },
        {
          id: 'm6',
          titulo: 'Portfólio e mercado',
          licoes: [
            {
              id: 'm6-l1',
              titulo: 'README e documentação do projeto',
              desc: 'Escrevendo a documentação que faz seu projeto parecer profissional.',
            },
            {
              id: 'm6-l2',
              titulo: 'Git e GitHub — versionando o projeto',
              desc: 'Colocando o projeto no ar de forma versionada.',
            },
            {
              id: 'm6-l3',
              titulo: 'Preparando para CI/CD',
              desc: 'O que é, por que importa, e os primeiros passos.',
            },
            {
              id: 'm6-l4',
              titulo: 'Usando IA como apoio — não como muleta',
              desc: 'Como usar IA para pensar melhor, sem terceirizar o raciocínio.',
            },
            {
              id: 'm6-l5',
              titulo: 'Perguntas de entrevista — treino de explicação',
              desc: 'Praticando como explicar suas decisões técnicas numa entrevista.',
            },
          ],
        },
      ];

      const NIVEIS = [
        'Não conheço',
        'Reconheço o conceito',
        'Consigo fazer com orientação',
        'Consigo fazer sozinho',
        'Consigo explicar para outra pessoa',
        'Consigo resolver um problema novo',
      ];
      const NIVEL_EMOJI = ['🟢', '🔵', '🟡', '🟠', '🔴', '🟣'];

      const st = { activeLessonId: null };
      function loadJ(k, fb) {
        try {
          const v = localStorage.getItem(k);
          return v ? JSON.parse(v) : fb;
        } catch {
          return fb;
        }
      }
      function saveJ(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch {}
      }
      let progress = loadJ('apiqacurso_progress_v110', {});
      let cache = loadJ('apiqacurso_content_v110', {});

      function gp(id) {
        if (!progress[id])
          progress[id] = { done: false, nivel: 0, checklist: [] };
        return progress[id];
      }
      function sp() {
        saveJ('apiqacurso_progress_v110', progress);
      }
      function sc() {
        saveJ('apiqacurso_content_v110', cache);
      }
      function allLessons() {
        return CURRICULO.flatMap((m) =>
          m.licoes.map((l) => ({
            ...l,
            moduloId: m.id,
            moduloTitulo: m.titulo,
            moduloNovo: !!m.novo,
          }))
        );
      }
      function esc(s) {
        if (!s) return '';
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        );
      }

      const SYS_LESSON = `Você é um instrutor sênior de QA e Automação de Testes de API ensinando iniciantes do zero. Formato de resposta — JSON PURO, sem markdown:
{
  "objetivo": "1 frase",
  "conceito": "explicação simples, máx 4 frases",
  "analogia": "comparação cotidiana",
  "comoFunciona": "explicação técnica",
  "exemploTecnico": "exemplo real",
  "exemploProfissional": "mercado",
  "pratica": ["passo 1", "passo 2"],
  "teste": "como verificar",
  "desafio": "exercício",
  "resumo": "resumo",
  "checklist": ["item 1", "item 2"]
}`;

      function buildLessonLocally(lesson) {
        return {
          objetivo: lesson.desc,
          conceito: `${lesson.titulo} é estudado com exemplos e verificações locais, usando somente o conteúdo deste currículo.`,
          analogia: 'Pense na aula como um roteiro de estudo: primeiro você entende, depois pratica e por fim confere o resultado.',
          comoFunciona: 'Leia a explicação, observe o exemplo versionado e avance apenas quando conseguir explicar o que foi apresentado.',
          exemploTecnico: `Exemplo relacionado ao tema: ${lesson.titulo}. Ajuste os valores ao contrato ou material que estiver estudando.`,
          exemploProfissional: 'Em um projeto real, confirme a regra na documentação e registre a evidência antes de concluir o teste.',
          pratica: ['Leia o objetivo da aula.', 'Anote o que ainda não está claro.', 'Compare sua resposta com a documentação disponível.'],
          teste: 'Verifique se você consegue explicar o conceito e identificar o resultado esperado sem consultar uma fonte não versionada.',
          desafio: `Descreva um exemplo próprio para o tema “${lesson.titulo}” e indique o que precisaria ser confirmado.`,
          resumo: `A aula apresenta ${lesson.titulo.toLowerCase()} de forma progressiva e prática.`,
          checklist: ['Entendi o conceito principal.', 'Consegui relacionar o exemplo ao tema.', 'Registrei dúvidas ou GAPs restantes.'],
        };
      }

      let openMod = null;
      function counts() {
        let d = 0,
          t = 0;
        CURRICULO.forEach((m) =>
          m.licoes.forEach((l) => {
            t++;
            if (gp(l.id).done) d++;
          })
        );
        return { d, t };
      }

      function renderSidebar() {
        const { d, t } = counts();
        document.getElementById('overall-label').textContent = d + '/' + t;
        document.getElementById('overall-bar').style.width =
          (t ? (d / t) * 100 : 0) + '%';
        const box = document.getElementById('modules-list');
        box.innerHTML = CURRICULO.map((m) => {
          const md = m.licoes.filter((l) => gp(l.id).done).length;
          const isOpen = m.id === openMod;
          return `<div class="module ${isOpen ? 'open' : ''}" data-mod="${m.id}">
      <div class="module-head" data-tog="${m.id}">
        <span class="chev">▶</span>
        <b>${esc(m.titulo)}${m.novo ? '<span class="tag novo">NOVO</span>' : ''}</b>
        <span class="cnt">${md}/${m.licoes.length}</span>
      </div>
      <div class="mod-bar"><div class="mod-bar-fill" style="width:${m.licoes.length ? (md / m.licoes.length) * 100 : 0}%"></div></div>
      <div class="lesson-list">
        ${m.licoes
          .map((l) => {
            const p = gp(l.id);
            return `<div class="lesson-item ${p.done ? 'done' : ''} ${st.activeLessonId === l.id ? 'active' : ''} ${l.novo ? 'new-topic' : ''}" data-les="${l.id}">
            <span class="chk">${p.done ? '✓' : ''}</span><span class="ltitle">${esc(l.titulo)}</span>
          </div>`;
          })
          .join('')}
      </div>
    </div>`;
        }).join('');
        box.querySelectorAll('[data-tog]').forEach((el) =>
          el.addEventListener('click', () => {
            openMod = openMod === el.dataset.tog ? null : el.dataset.tog;
            renderSidebar();
          })
        );
        box
          .querySelectorAll('[data-les]')
          .forEach((el) =>
            el.addEventListener('click', () => openLesson(el.dataset.les))
          );
      }

      document.getElementById('btn-continuar').addEventListener('click', () => {
        const al = allLessons();
        const nx = al.find((l) => !gp(l.id).done) || al[0];
        if (nx) {
          openMod = nx.moduloId;
          openLesson(nx.id);
        }
      });

      function renderIntro() {
        document.getElementById('content-area').innerHTML = `
    <h1>Zero → Automação de API</h1>
    <div class="subtitle">Postman + Cypress com Restful-Booker e DummyJSON. v1.1.0</div>
    <div class="intro-card">
      <h3>Trilha Completa de Aulas</h3>
      <p>Navegue pelos módulos na barra lateral esquerda para iniciar os estudos. O progresso é salvo automaticamente no seu navegador.</p>
    </div>`;
      }

      async function openLesson(id) {
        st.activeLessonId = id;
        const les = allLessons().find((l) => l.id === id);
        if (!les) return;
        renderSidebar();
        const area = document.getElementById('content-area');
        area.innerHTML = `
    <div class="lesson-header">
      <span class="badge ${les.moduloNovo || les.novo ? 'new' : ''}">${esc(les.moduloTitulo)}</span>
    </div>
    <h1>${esc(les.titulo)}</h1>
    <div class="subtitle">${esc(les.desc)}</div>
    <div id="lesson-body"></div>`;

        if (!cache[id]) {
          document.getElementById('lesson-body').innerHTML =
            '<div class="loading"><div class="spinner"></div>Carregando aula...</div>';
          try {
            cache[id] = buildLessonLocally(les);
            sc();
          } catch (e) {
            document.getElementById('lesson-body').innerHTML =
              `<div class="error-box">Não foi possível carregar o conteúdo local desta aula. Verifique o currículo versionado e tente novamente.</div>`;
            return;
          }
        }
        renderBody(les, cache[id]);
      }

      function codeWrap(title, code) {
        const cid = 'copy-' + Math.random().toString(36).slice(2, 6);
        return `<div class="code-wrap"><div class="code-title"><span class="code-label">${esc(title)}</span><button class="small" id="${cid}">copiar</button></div><div class="code-body">${esc(code)}</div></div>`;
      }

      function renderBody(les, c) {
        const box = document.getElementById('lesson-body');
        if (!box) return;
        const p = gp(les.id);
        let html = '';
        html += `<div class="card"><h3>🎯 Objetivo</h3><p>${esc(c.objetivo)}</p></div>`;
        html += `<div class="card"><h3>🧠 Conceito</h3><p>${esc(c.conceito)}</p></div>`;
        if (c.analogia)
          html += `<div class="card"><h3>🌎 Analogia</h3><p>${esc(c.analogia)}</p></div>`;
        html += `<div class="card"><h3>🔎 Como funciona</h3><p>${esc(c.comoFunciona)}</p></div>`;
        if (c.exemploTecnico)
          html += `<div class="card"><h3>💻 Exemplo técnico</h3>${codeWrap('exemplo', c.exemploTecnico)}</div>`;
        if (c.exemploProfissional)
          html += `<div class="card"><h3>🏢 No mercado</h3><p>${esc(c.exemploProfissional)}</p></div>`;
        if (c.pratica && c.pratica.length)
          html += `<div class="card"><h3>🛠️ Prática</h3><ol>${c.pratica.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
        if (c.teste)
          html += `<div class="callout teste"><h4>🔬 Como testar</h4><p>${esc(c.teste)}</p></div>`;
        if (c.desafio)
          html += `<div class="callout desafio"><h4>🧩 Desafio</h4><p>${esc(c.desafio)}</p></div>`;
        if (c.resumo)
          html += `<div class="card"><h3>📝 Resumo</h3><p>${esc(c.resumo)}</p></div>`;
        if (c.checklist && c.checklist.length) {
          html += `<div class="card"><h3>✅ Checklist</h3>`;
          c.checklist.forEach((item, i) => {
            const ck = !!p.checklist[i];
            html += `<div class="checklist-item ${ck ? 'checked' : ''}" data-ci="${i}"><div class="box">${ck ? '✓' : ''}</div><span class="txt">${esc(item)}</span></div>`;
          });
          html += `</div>`;
        }
        html += `<div class="card"><h3>Seu nível</h3>
    <div class="nivel-row">${NIVEL_EMOJI.map((e, i) => `<button class="nivel-dot ${p.nivel === i ? 'sel' : ''}" data-nv="${i}">${e}</button>`).join('')}</div>
    <div class="nivel-lbl">${NIVEIS[p.nivel]}</div></div>`;
        html += `<div class="row">
    <button class="${p.done ? 'teal' : 'primary'}" id="btn-done">${p.done ? '✓ Concluída' : 'Marcar como concluída'}</button>
  </div>`;
        box.innerHTML = html;

        box.querySelectorAll('[data-ci]').forEach((el) =>
          el.addEventListener('click', () => {
            const i = +el.dataset.ci;
            p.checklist[i] = !p.checklist[i];
            sp();
            renderBody(les, c);
          })
        );
        box.querySelectorAll('[data-nv]').forEach((el) =>
          el.addEventListener('click', () => {
            p.nivel = +el.dataset.nv;
            sp();
            renderBody(les, c);
          })
        );
        document.getElementById('btn-done').addEventListener('click', () => {
          p.done = !p.done;
          sp();
          renderSidebar();
          renderBody(les, c);
        });
        box.querySelectorAll('.code-wrap button.small').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            const pre = e.currentTarget
              .closest('.code-wrap')
              .querySelector('.code-body');
            copyText(pre ? pre.textContent : '', e.currentTarget);
          });
        });
      }

      function copyText(txt, btn) {
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(txt);
        }
      }

      try {
        if (window.self === window.top)
          document.body.classList.add('standalone');
      } catch {}
      renderIntro();
      renderSidebar();
    </script>
  </body>
</html>
